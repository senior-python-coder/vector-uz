  theme: {
    extend: {
      colors: {
        lime: { 400:'#bfff00', 500:'#aaff00', 600:'#88cc00' },

        syne: ['Syne','sans-serif'],
        dm:   ['DM Sans','sans-serif'],
      },
      boxShadow: {
        'lime': '0 0 0 1px rgba(191,255,0,0.35), 0 0 28px rgba(191,255,0,0.12)',
        'lime-lg': '0 0 0 1px rgba(191,255,0,0.5), 0 8px 40px rgba(191,255,0,0.18)',
      }
    }
  }

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --lime:#bfff00; --lime-glow:rgba(191,255,0,0.14);
    --bg:#0a0a0a; --s1:#111; --s2:#161616; --s3:#1e1e1e;
    --text:#f0f0f0; --muted:#555; --muted2:#888;
    --border:rgba(255,255,255,0.06);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);color:var(--text);
    font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    opacity:0.025;pointer-events:none;
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:0;
    background-image:
      linear-gradient(rgba(191,255,0,0.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(191,255,0,0.022) 1px,transparent 1px);
    background-size:52px 52px;pointer-events:none;
  }

  /* NAV */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 56px;
    background:linear-gradient(180deg,rgba(10,10,10,0.97) 0%,transparent 100%);
    backdrop-filter:blur(6px);
  }
  .logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.5px;color:#f0f0f0;}
  .logo span{color:var(--lime);}
  .nav-right{display:flex;align-items:center;gap:28px;}
  .nav-link{font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:1px;text-transform:uppercase;transition:color .2s;}
  .nav-link:hover{color:var(--text);}
  .nav-cta{
    font-size:12px;font-weight:600;color:var(--bg);background:var(--lime);
    border:none;padding:9px 20px;cursor:pointer;letter-spacing:.3px;
    clip-path:polygon(7px 0%,100% 0%,calc(100% - 7px) 100%,0% 100%);
    transition:background .2s,transform .15s;
  }
  .nav-cta:hover{background:#ccff33;transform:translateY(-1px);}

  /* SEARCH */
  .search-wrap{position:relative;}
  .search-input{
    width:100%;background:var(--s2);
    border:1px solid var(--border);color:var(--text);
    padding:14px 20px 14px 48px;
    font-family:'DM Sans',sans-serif;font-size:14px;
    outline:none;transition:border-color .2s,box-shadow .2s;
    appearance:none;
  }
  .search-input:focus{border-color:rgba(191,255,0,.45);box-shadow:0 0 0 3px rgba(191,255,0,.07);}
  .search-input::placeholder{color:var(--muted);}
  .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none;}

  /* FILTER PILLS */
  .filter-pill{
    padding:7px 16px;font-size:11px;font-weight:500;letter-spacing:.8px;
    text-transform:uppercase;cursor:pointer;border:1px solid var(--border);
    background:var(--s2);color:var(--muted);transition:all .2s;white-space:nowrap;
  }
  .filter-pill:hover,.filter-pill.active{
    border-color:rgba(191,255,0,.45);color:var(--lime);background:rgba(191,255,0,.07);
  }

  /* CARD */
  .prof-card{
    background:var(--s1);border:1px solid var(--border);
    padding:24px;display:flex;flex-direction:column;gap:0;
    position:relative;overflow:hidden;
    transition:border-color .25s,box-shadow .25s,transform .25s;
    cursor:pointer;
  }
  .prof-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(191,255,0,0),transparent);
    transition:background .3s;
  }
  .prof-card:hover{
    border-color:rgba(191,255,0,.4);
    box-shadow:0 0 0 1px rgba(191,255,0,.25),0 8px 40px rgba(191,255,0,.12);
    transform:translateY(-3px);
  }
  .prof-card:hover::before{
    background:linear-gradient(90deg,transparent,rgba(191,255,0,.55),transparent);
  }

  /* ICON BADGE */
  .card-icon{
    width:42px;height:42px;flex-shrink:0;
    border:1px solid rgba(191,255,0,.2);background:rgba(191,255,0,.07);
    display:flex;align-items:center;justify-content:center;font-size:20px;
    margin-bottom:16px;transition:background .25s;
  }
  .prof-card:hover .card-icon{background:rgba(191,255,0,.14);}

  /* SCORE BAR */
  .score-track{height:3px;background:rgba(255,255,255,.05);margin:14px 0 4px;}
  .score-fill{
    height:100%;background:linear-gradient(90deg,var(--lime),#88cc00);
    transition:width 1s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 6px rgba(191,255,0,.4);
  }

  /* LEARN MORE BTN */
  .learn-btn{
    margin-top:auto;padding-top:18px;
    display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.05);
    font-size:12px;letter-spacing:1px;text-transform:uppercase;
    color:var(--muted);text-decoration:none;
    transition:color .2s;
  }
  .learn-btn:hover{color:var(--lime);}
  .learn-btn svg{transition:transform .2s;}
  .learn-btn:hover svg{transform:translateX(4px);}

  /* EMPTY STATE */
  #empty-state{display:none;text-align:center;padding:80px 20px;}

  /* STATS TICKER */
  .stat-pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px;background:var(--s2);border:1px solid var(--border);
    font-size:11px;letter-spacing:.5px;color:var(--muted2);
  }
  .stat-pill strong{font-family:'Syne',sans-serif;color:var(--lime);font-size:14px;}

  /* CATEGORY SECTION LABEL */
  .section-label{
    display:flex;align-items:center;gap:10px;
    font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);
  }
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}

  /* COUNT BADGE */
  .count-badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:22px;height:18px;padding:0 6px;
    background:rgba(191,255,0,.12);border:1px solid rgba(191,255,0,.25);
    font-size:10px;font-weight:700;color:var(--lime);font-family:'Syne',sans-serif;
  }

  /* SCROLL */
  ::-webkit-scrollbar{width:3px;}
  ::-webkit-scrollbar-track{background:#111;}
  ::-webkit-scrollbar-thumb{background:#2a2a2a;}

  /* ANIMATIONS */
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(191,255,0,.5);}50%{box-shadow:0 0 0 5px rgba(191,255,0,0);}}
  .anim-up{animation:fadeUp .5s ease both;}

  @media(max-width:768px){
    nav{padding:16px 20px;}
    .nav-right .nav-link{display:none;}
  }
</style>
</head>

<!-- ══ MAIN ══ -->
<main class="relative z-10 pt-28 pb-24 px-6 md:px-14 max-w-screen-xl mx-auto">

  <!-- HEADER -->
  <div class="mb-14 anim-up">
    <div class="flex items-center gap-2 mb-5">
      <div class="w-1.5 h-1.5 rounded-full" style="background:var(--lime);box-shadow:0 0 8px var(--lime);animation:pulse 2s infinite;"></div>

    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">

  </div>

  <!-- SEARCH + FILTERS -->
  <div class="mb-10 anim-up" style="animation-delay:.1s;">
    <div class="search-wrap mb-4">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="8" cy="8" r="5.5" stroke="#555" stroke-width="1.4"/>
        <path d="M13 13l2.5 2.5" stroke="#555" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <input class="search-input" type="text" id="search-input"
             placeholder="Kasb nomi yoki kalit so'z kiriting... (masalan: dasturchi, dizayner)"
             oninput="filterCards()">
    </div>

    <!-- Filter pills -->
    <div class="flex gap-2 flex-wrap">
      <button class="filter-pill active" data-filter="all" onclick="setFilter(this,'all')">
        Barchasi
      </button>
      <button class="filter-pill" data-filter="tech" onclick="setFilter(this,'tech')">💻 Texnologiya</button>
      <button class="filter-pill" data-filter="creative" onclick="setFilter(this,'creative')">🎨 Kreativ</button>
      <button class="filter-pill" data-filter="social" onclick="setFilter(this,'social')">🤝 Ijtimoiy</button>
      <button class="filter-pill" data-filter="business" onclick="setFilter(this,'business')">📈 Biznes</button>
      <button class="filter-pill" data-filter="science" onclick="setFilter(this,'science')">🔬 Fan</button>
    </div>
  </div>

  <!-- RESULTS META -->
  <div class="flex items-center justify-between mb-6">
    <div class="section-label" style="flex:1;">
      <span id="results-label">Barcha kasblar</span>
      <span class="count-badge" id="results-count">25</span>
    </div>
    <div class="ml-6 flex gap-2">
      <button onclick="setSort('match')" id="sort-match"
        class="filter-pill active text-xs" style="font-size:10px;padding:5px 12px;">Mos kelish ↓</button>
      <button onclick="setSort('alpha')" id="sort-alpha"
        class="filter-pill text-xs" style="font-size:10px;padding:5px 12px;">A–Z</button>
    </div>
  </div>

  <!-- CARDS GRID -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="cards-grid"></div>

  <!-- EMPTY STATE -->
  <div id="empty-state">
    <div style="font-size:48px;margin-bottom:16px;">🔭</div>
    <div class="font-syne font-bold text-xl mb-2">Natija topilmadi</div>
    <div class="text-sm" style="color:var(--muted2);">Boshqa kalit so'z yoki soha bo'yicha qidiring</div>
    <button class="filter-pill active mt-6" onclick="resetFilters()">Filtrlani tozalash</button>
  </div>

</main>

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
let activeFilter = 'all';
let activeSort   = 'match';
let searchQuery  = '';

const demandColors = {
  "Juda yuqori": "rgba(191,255,0,0.85)",
  "Yuqori":       "rgba(191,255,0,0.6)",
  "O'sib bormoqda":"rgba(100,220,255,0.7)",
  "O'rtacha":     "rgba(255,255,255,0.35)",
  "Har doim":     "rgba(191,255,0,0.85)",
};

// ══════════════════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════════════════
function renderCards() {
  let list = [...PROFESSIONS];

  // filter
  if (activeFilter !== 'all') list = list.filter(p => p.category === activeFilter);

  // search
  if (searchQuery.trim()) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p =>
      p.title.toLowerCase().includes(q) ||
      p.desc.toLowerCase().includes(q)  ||
      p.tags.some(t => t.toLowerCase().includes(q))
    );
  }

  // sort
  if (activeSort === 'match') list.sort((a,b) => b.score - a.score);
  else list.sort((a,b) => a.title.localeCompare(b.title, 'uz'));

  const grid  = document.getElementById('cards-grid');
  const empty = document.getElementById('empty-state');
  const countEl = document.getElementById('results-count');
  const labelEl = document.getElementById('results-label');

  countEl.textContent = list.length;
  labelEl.textContent = activeFilter === 'all' ? 'Barcha kasblar' :
    { tech:'Texnologiya', creative:'Kreativ', social:'Ijtimoiy', business:'Biznes', science:'Fan' }[activeFilter];

  if (!list.length) {
    grid.innerHTML = ''; grid.style.display = 'none';
    empty.style.display = 'block'; return;
  }
  grid.style.display = 'grid'; empty.style.display = 'none';

  grid.innerHTML = list.map((p, idx) => `
    <div class="prof-card" style="animation:fadeUp 0.4s ${idx * 0.04}s ease both;">

      <!-- Top row: icon + demand badge -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;">
        <div class="card-icon">${p.emoji}</div>
        <span style="
          font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
          padding:3px 9px;border:1px solid rgba(255,255,255,0.07);
          color:${demandColors[p.demand]};
          background:rgba(255,255,255,0.03);
        ">${p.demand}</span>
      </div>

      <!-- Title -->
      <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:700;color:#f0f0f0;line-height:1.2;margin-bottom:8px;">
        ${p.title}
      </div>

      <!-- Description -->
      <div style="font-size:13px;color:var(--muted2);line-height:1.6;margin-bottom:16px;flex:1;">
        ${p.desc}
      </div>

      <!-- Tags -->
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px;">
        ${p.tags.map(t => `
          <span style="
            font-size:10px;letter-spacing:.4px;padding:3px 9px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.07);color:var(--muted2);
          ">${t}</span>
        `).join('')}
      </div>

      <!-- Compatibility score -->
      <div style="margin-bottom:4px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <span style="font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);">Mos kelish</span>
          <span style="font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--lime);">${p.score}%</span>
        </div>
        <div class="score-track">
          <div class="score-fill" style="width:0%;" data-val="${p.score}"></div>
        </div>
      </div>

      <!-- Learn more -->
      <a href="#" class="learn-btn" onclick="openCard(event,${p.id})">
        <span>Batafsil ko'rish</span>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 7h8M8 4l3 3-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  `).join('');

  // animate score bars
  requestAnimationFrame(() => {
    setTimeout(() => {
      document.querySelectorAll('.score-fill').forEach(el => {
        el.style.width = el.dataset.val + '%';
      });
    }, 80);
  });
}

// ══════════════════════════════════════════════════════════
//  CONTROLS
// ══════════════════════════════════════════════════════════
function filterCards() {
  searchQuery = document.getElementById('search-input').value;
  renderCards();
}

function setFilter(btn, filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-pill[data-filter]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function setSort(type) {
  activeSort = type;
  document.getElementById('sort-match').classList.toggle('active', type === 'match');
  document.getElementById('sort-alpha').classList.toggle('active', type === 'alpha');
  renderCards();
}

function resetFilters() {
  searchQuery = ''; activeFilter = 'all'; activeSort = 'match';
  document.getElementById('search-input').value = '';
  document.querySelectorAll('.filter-pill[data-filter]').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === 'all');
  });
  renderCards();
}

function openCard(e, id) {
  e.preventDefault();
  const p = PROFESSIONS.find(x => x.id === id);
  if (!p) return;
  // Simple toast for now — replace with modal when needed
  const toast = document.createElement('div');
  toast.style.cssText = `
    position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:999;
    background:#161616;border:1px solid rgba(191,255,0,0.3);
    padding:14px 24px;display:flex;align-items:center;gap:12px;
    font-size:13px;color:#f0f0f0;box-shadow:0 0 24px rgba(191,255,0,0.12);
    animation:fadeUp .3s ease both;
  `;
  toast.innerHTML = `<span style="font-size:20px;">${p.emoji}</span> <strong style="color:var(--lime)">${p.title}</strong> — tez orada batafsil sahifa!`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// keyboard shortcut: / to focus search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.id !== 'search-input') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
  if (e.key === 'Escape') {
    document.getElementById('search-input').blur();
    resetFilters();
  }
});

// init
renderCards();
</script>
</body>
</html>
